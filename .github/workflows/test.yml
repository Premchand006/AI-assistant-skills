name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: nothing here needs to write to the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: structure and scripts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The dependency file is not named requirements.txt, so the default
          # cache glob finds nothing and the action fails. Point it at ours.
          cache-dependency-path: requirements-dev.txt

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Frontmatter, size budgets, house style, referenced files, eval files.
      - name: validate skills
        run: python tools/validate_skills.py --strict

      # Every bundled checker finds the planted defects in the fixtures, and
      # stays quiet on the clean ones.
      - name: script behaviour
        run: python tools/test_scripts.py

      # Everything compiles; dependency-missing paths explain themselves;
      # the ONNX quantisation runs end to end.
      - name: smoke
        run: python tools/smoke_imports.py

      # Re-grade the committed transcripts. No API key, no model call: this
      # checks that the published results table still follows from the
      # recorded responses and the graders in each eval.yaml.
      - name: replay evals
        run: python evals/eval_runner.py --runner replay

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck -S warning skills/*/scripts/*.sh

      # The checkers have to keep working on a machine where none of the EDA
      # tools are installed, reporting what was skipped rather than failing.
      - name: wrapper scripts degrade cleanly
        run: |
          set -e
          bash skills/rtl-verilog-lint/scripts/lint_rtl.sh \
               evals/fixtures/rtl/good_counter.sv
          bash skills/embedded-firmware-misra/scripts/run_static.sh \
               evals/fixtures/firmware/uart_driver.c || true
