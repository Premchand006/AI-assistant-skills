name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: structure and scripts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      # Frontmatter, size budgets, house style, referenced files, eval files.
      - name: validate skills
        run: python tools/validate_skills.py --strict

      # Every bundled checker finds the planted defects in the fixtures, and
      # stays quiet on the clean ones.
      - name: script behaviour
        run: python tools/test_scripts.py

      # Everything compiles; dependency-missing paths explain themselves;
      # the ONNX quantisation runs end to end.
      - name: smoke
        run: python tools/smoke_imports.py

      # Re-grade the committed transcripts. No API key, no model call: this
      # checks that the published results table still follows from the
      # recorded responses and the graders in each eval.yaml.
      - name: replay evals
        run: python evals/eval_runner.py --runner replay

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning skills/*/scripts/*.sh
